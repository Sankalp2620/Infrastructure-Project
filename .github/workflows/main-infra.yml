
name: Terraform Infra Deployment

on:
  workflow_dispatch:
    inputs:
      action:
        description: Select Terraform action
        required: true
        default: apply
        type: choice
        options:
          - apply
          - destroy

  push:
    branches-ignore:
      - main

  pull_request:
    branches:
      - main

jobs:
  my_job:
    name: deploy to staging
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./dev

    env:
      TF_ACTION: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.action || 'apply' }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Terraform action
        run: |
          echo "Selected action: $TF_ACTION"
          if [ "$TF_ACTION" != "apply" ] && [ "$TF_ACTION" != "destroy" ]; then
            echo "Invalid action selected: $TF_ACTION"
            exit 1
          fi

      - name: AWS Login
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: HashiCorp - Setup Terraform
        uses: hashicorp/setup-terraform@v2.0.3

      - name: Check Terraform version
        run: |
          echo "Terraform version: $(terraform -version)"

      - name: Terraform Init
        run: |
          echo "Initializing Terraform..."
          terraform init

      - name: Terraform format
        run: |
          echo "Checking Terraform format..."
          terraform fmt -check -recursive

      - name: Terraform validate
        run: |
          echo "Validating Terraform configuration..."
          terraform validate

      - name: Terraform plan
        run: |
          echo "Generating Terraform plan..."
          if [ "$TF_ACTION" = "destroy" ]; then
            terraform plan -destroy -out=tfplan
          else
            terraform plan -out=tfplan
          fi

      - name: Terraform apply or destroy
        run: |
          if [ "$TF_ACTION" = "destroy" ]; then
            echo "Destroying Terraform infrastructure..."
            terraform apply -auto-approve tfplan
            echo "Terraform destroy completed successfully."
          else
            echo "Applying Terraform plan..."
            terraform apply -auto-approve tfplan
            echo "Terraform apply completed successfully."
          fi